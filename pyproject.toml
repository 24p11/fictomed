[project]
name = "fictomed"
version = "0.1.2"
description = "Package de génération de séjours et de scénario fictifs"
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
authors = [
    { name = "Arthur LAMARD", email = "arthur.lamard@chu-brest.fr" },
    { name = "Basile FUCHS", email = "basile.fuchs@chu-brest.fr" },
    { name = "Claire DECHAUX", email = "claire.dechaux@inria.fr" },
    { name = "Remi FLICOTEAUX", email = "remi.flicoteaux@aphp.fr" },
]
dependencies = [
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
]
[project.urls]
Homepage = "https://github.com/CHU-Brest/fictomed"
Repository = "https://github.com/CHU-Brest/fictomed"
[tool.setuptools.packages.find]
include = ["fictomed*"]
exclude = ["data*", "scenarios*", "reports*"]
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
